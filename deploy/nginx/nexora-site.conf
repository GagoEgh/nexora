# nginx server block for the prerendered Nexora site.
#
# Why this file exists: `public/_headers` and `public/_redirects` are a Netlify convention.
# nginx does not read either one, so on an nginx host the enforced CSP, `Permissions-Policy`
# and `Cross-Origin-Opener-Policy` are simply absent, and an unknown URL answers `200` with
# whatever `location /` falls back to instead of the localized 404. Checked against the live
# site, that is exactly what was happening. This block re-expresses both files for nginx.
#
# The headers are NOT written out here. They are generated from `public/_headers` into
# `nexora-headers.conf` by `npm run verify:headers -- --write`, and `npm run verify:headers`
# fails the build when the two drift. `_headers` stays the single source of truth, which
# matters most for the CSP: its `script-src` hash list is regenerated from the build, so a
# hand-maintained second copy here would go stale silently and block hydration in production.
#
# Install:
#   cp deploy/nginx/nexora-headers.conf /etc/nginx/snippets/nexora-headers.conf
#   cp deploy/nginx/nexora-site.conf    /etc/nginx/sites-available/nexora
#   ln -s /etc/nginx/sites-available/nexora /etc/nginx/sites-enabled/nexora
#   nginx -t && systemctl reload nginx
#
# Then publish the build: the contents of `dist/nexora/browser` go in `root` below.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nexoratechnology.org www.nexoratechnology.org;

    # Managed elsewhere (certbot or equivalent); named here only so the block is complete.
    # ssl_certificate     /etc/letsencrypt/live/nexoratechnology.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nexoratechnology.org/privkey.pem;

    root /srv/nexora;
    index index.html;

    # The response headers from `public/_headers`, generated - see the note at the top.
    #
    # One nginx rule governs everything below: `add_header` in a nested level DISCARDS every
    # header inherited from this one. No location in this file uses `add_header`, which is why
    # cache control below is expressed with `expires` instead. If you ever add an `add_header`
    # to a location, you must repeat this include inside that location or the whole security
    # header set vanishes for those responses - silently, and only for some paths.
    include snippets/nexora-headers.conf;

    # Neither file is a web asset, and `_headers` lists the CSP hashes. Without this they are
    # served as text/plain to anyone who asks, because `angular.json` copies all of `public/`
    # into the publish root.
    location ~ ^/_(headers|redirects)$ {
        return 404;
    }

    # Hashed filenames, so the content behind a given URL never changes.
    location ~* \.(?:js|css|woff2|svg|png|webp|avif|ico)$ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Prerendered HTML. `expires -1` sends `Cache-Control: no-cache`, so a visitor revalidates
    # and picks up a new deploy immediately rather than holding a stale document that
    # references asset filenames the server no longer has.
    location = /robots.txt { expires -1; try_files $uri =404; }
    location = /sitemap.xml { expires -1; try_files $uri =404; }

    # The localized 404s, most specific first - the same ordering `_redirects` relies on, so a
    # bad URL under /hy or /ru answers in that language instead of falling through to English.
    #
    # `error_page 404 /...` keeps the 404 status. That is the point: a rewrite answering 200
    # would tell crawlers a mistyped URL is a real page, and the branded not-found content
    # would start competing with the pages it replaces.
    location /hy/ {
        expires -1;
        error_page 404 /hy/not-found/index.html;
        try_files $uri $uri/index.html $uri/ =404;
    }

    location /ru/ {
        expires -1;
        error_page 404 /ru/not-found/index.html;
        try_files $uri $uri/index.html $uri/ =404;
    }

    location / {
        expires -1;
        error_page 404 /not-found/index.html;
        try_files $uri $uri/index.html $uri/ =404;
    }

    # The API, when it is deployed, belongs in this same server block: copy the `location /api/`
    # from the backend repo's `deploy/nginx/nexora-api-proxy.conf` in here, together with the
    # `limit_req_zone` from `nexora-api-ratelimit.conf` (that one goes in the `http` context,
    # not here). `/api/` is a longer prefix than `/`, so nginx prefers it regardless of order.
    #
    # Two things have to change in step with it, or the form breaks under CSP: `apiOrigin` in
    # `src/environments/environment.production.ts` and `connect-src` in `public/_headers`.
    # `verify:headers` asserts those two agree.
}

server {
    listen 80;
    listen [::]:80;
    server_name nexoratechnology.org www.nexoratechnology.org;
    return 301 https://nexoratechnology.org$request_uri;
}
