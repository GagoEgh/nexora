server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nexoratechnology.org;
    return 301 https://nexoratechnology.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nexoratechnology.org;

    root /srv/nexora;
    index index.html;
    charset utf-8;
    include snippets/nexora-brotli*.conf;
    include snippets/nexora-headers.conf;
    location ~ ^/_(headers|redirects)$ {
        return 404;
    }

    location ~* \.(?:js|css|woff2|svg|png|webp|avif|ico)$ {
        include snippets/nexora-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /robots.txt { expires -1; try_files $uri =404; }
    location = /sitemap.xml { expires -1; try_files $uri =404; }

    location /hy/ {
        expires -1;
        error_page 404 /hy/not-found/index.html;
        try_files $uri $uri/index.html $uri/ =404;
    }

    location /ru/ {
        expires -1;
        error_page 404 /ru/not-found/index.html;
        try_files $uri $uri/index.html $uri/ =404;
    }

    location / {
        expires -1;
        error_page 404 /not-found/index.html;
        try_files $uri $uri/index.html $uri/ =404;
    }

}

server {
    listen 80;
    listen [::]:80;
    server_name nexoratechnology.org www.nexoratechnology.org;
    return 301 https://nexoratechnology.org$request_uri;
}
