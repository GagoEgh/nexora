<section class="start-conversation" aria-labelledby="start-conversation-title">
  <div class="start-conversation__copy">
    <p class="start-conversation__eyebrow">{{ band().eyebrow }}</p>
    <h2 class="start-conversation__title" id="start-conversation-title">{{ band().title }}</h2>
    <p class="start-conversation__lead">{{ band().lead }}</p>

    @if (band().steps.length) {
      <ol class="start-conversation__steps">
        @for (step of band().steps; track $index; let i = $index) {
          <li class="start-conversation__step">
            <span class="start-conversation__marker" aria-hidden="true">{{ i + 1 }}</span>
            {{ step }}
          </li>
        }
      </ol>
    }

    <div class="start-conversation__actions">
      <a matButton="filled" [routerLink]="band().primary.path | localizedPath">
        {{ band().primary.label }}
        <mat-icon iconPositionEnd [svgIcon]="arrowIcon" />
      </a>
      <a
        class="start-conversation__secondary"
        matButton="outlined"
        [routerLink]="band().secondary.path | localizedPath"
      >
        {{ band().secondary.label }}
      </a>
    </div>
  </div>

  <div class="start-conversation__art" appReveal aria-hidden="true">
    <span class="start-conversation__ring">
      <span class="start-conversation__disc"></span>
      <img class="start-conversation__mark" src="brand/mark.svg" alt="" />
    </span>
  </div>
</section>
