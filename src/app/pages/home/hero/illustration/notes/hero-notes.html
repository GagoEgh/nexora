<div class="notes__card notes__workflow">
  <p class="notes__title">
    <mat-icon [svgIcon]="botIcon" />
    {{ content().workflow.title }}
  </p>
  <ul class="notes__steps">
    @for (step of content().workflow.steps; track $index) {
      <li class="notes__step" [class.notes__step--done]="step.done">
        <span class="notes__mark">
          @if (step.done) {
            <mat-icon [svgIcon]="checkIcon" />
          }
        </span>
        {{ step.label }}
      </li>
    }
  </ul>
</div>

<pre
  class="notes__card notes__request"
><span class="notes__method">{{ content().request.method }}</span> {{ content().request.path }}
<span class="notes__status">{{ content().request.status }}</span> {{ content().request.body }}</pre>
