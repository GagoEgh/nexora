<div class="art" appReveal="load">
  <div class="art__window">
    <div class="art__bar">
      <span class="art__dots"></span>
      <span class="art__path">{{ content().windowTitle }}</span>
    </div>

    <div class="art__canvas">
      @for (tier of content().tiers; track $index; let i = $index) {
        @if (i > 0) {
          <svg class="art__link" viewBox="0 0 100 56" preserveAspectRatio="none">
            <path
              class="art__link-line"
              [attr.d]="links[i - 1]"
              vector-effect="non-scaling-stroke"
            />
            <path
              class="art__link-pulse"
              [attr.d]="links[i - 1]"
              vector-effect="non-scaling-stroke"
            />
            <path class="art__link-dot" [attr.d]="junctions" vector-effect="non-scaling-stroke" />
          </svg>
        }
        <div class="art__tier">
          @for (node of tier; track $index) {
            <app-art-node class="art__node" [class.art__node--dark]="node.dark" [node]="node" />
          }
        </div>
      }

      <app-art-pipeline [steps]="content().pipeline" />
    </div>
  </div>

  <app-hero-notes [content]="content()" />
</div>
