<section class="start-conversation">
  <div class="start-conversation__copy">
    <p class="start-conversation__eyebrow">{{ content().eyebrow }}</p>
    <h2 class="start-conversation__title">{{ content().title }}</h2>
    <p class="start-conversation__lead">{{ content().lead }}</p>

    <ol class="start-conversation__steps">
      @for (step of content().steps; track $index; let i = $index) {
        <li class="start-conversation__step">
          <span class="start-conversation__marker" aria-hidden="true">{{ i + 1 }}</span>
          {{ step }}
        </li>
      }
    </ol>

    <div class="start-conversation__actions">
      <a matButton="filled" [routerLink]="'/contact' | localizedPath">
        {{ content().primaryCta }}
        <mat-icon iconPositionEnd [svgIcon]="arrowIcon" />
      </a>
      <a
        class="start-conversation__secondary"
        matButton="outlined"
        [routerLink]="'/partnerships' | localizedPath"
      >
        {{ content().secondaryCta }}
      </a>
    </div>
  </div>

  <div class="start-conversation__art" aria-hidden="true">
    <span class="start-conversation__ring">
      <span class="start-conversation__disc"></span>
      <img class="start-conversation__mark" src="brand/mark.svg" alt="" />
    </span>
  </div>
</section>
