<section class="what-we-build">
  <div class="what-we-build__header">
    <div class="what-we-build__heading">
      <p class="what-we-build__eyebrow">{{ content().eyebrow }}</p>
      <h2 class="what-we-build__title">{{ content().title }}</h2>
    </div>

    <p class="what-we-build__intro">{{ content().intro }}</p>
  </div>

  <ul class="what-we-build__grid">
    @for (item of content().items; track $index) {
      <li class="what-we-build__card">
        <app-what-we-build-illustration [kind]="item.illustration.value" />
        <div class="what-we-build__card-copy">
          <h3 class="what-we-build__card-title">{{ item.title }}</h3>
          <p class="what-we-build__card-desc">{{ item.description }}</p>
        </div>
      </li>
    }
  </ul>

  <p class="what-we-build__note">{{ content().note }}</p>
</section>
