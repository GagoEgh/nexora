<section class="finder" appReveal aria-labelledby="finder-title">
  <h2 class="finder__title" id="finder-title">{{ content().title }}</h2>

  <dl class="finder__rows">
    @for (entry of rows(); track $index) {
      <div class="finder__row">
        <dt class="finder__need">
          <span class="finder__label">{{ content().need }}</span>
          <span class="finder__statement">{{ entry.row.statement }}</span>
        </dt>

        <dd class="finder__model">
          <mat-icon class="finder__arrow" aria-hidden="true" [svgIcon]="arrowIcon" />

          <a
            class="finder__chip"
            [class.finder__chip--current]="entry.id === current()"
            [attr.aria-current]="entry.id === current() ? 'location' : null"
            [routerLink]="[]"
            [queryParams]="{ model: entry.id }"
            >{{ entry.row.model }}</a
          >
        </dd>
      </div>
    }
  </dl>
</section>
