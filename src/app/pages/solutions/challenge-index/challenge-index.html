<ul class="challenge-index" appReveal>
  @for (item of content().items; track $index) {
    <li class="challenge-index__item">
      <a
        class="challenge-index__card"
        [routerLink]="[]"
        [queryParams]="{ challenge: item.id.value }"
      >
        <span class="challenge-index__number">{{ ordinal($index) }}</span>
        <span class="challenge-index__title">{{ item.title }}</span>
      </a>
    </li>
  }
</ul>
