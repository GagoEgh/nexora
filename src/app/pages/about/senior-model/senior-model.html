<section class="senior" appReveal aria-labelledby="senior-title">
  <div class="senior__copy">
    <div class="senior__heading">
      <p class="senior__eyebrow">{{ content().eyebrow }}</p>
      <h2 class="senior__title" id="senior-title">{{ content().title }}</h2>
    </div>

    <p class="senior__lead">{{ content().lead }}</p>

    <ul class="senior__points">
      @for (point of content().points; track $index) {
        <li class="senior__point">
          <span class="senior__badge" aria-hidden="true">
            <mat-icon [svgIcon]="arrowIcon" />
          </span>
          <span class="senior__point-text">{{ point }}</span>
        </li>
      }
    </ul>
  </div>

  <div class="senior__models">
    <app-model-panel
      tone="plain"
      [label]="content().pyramid.label.value"
      [rows]="pyramidRows"
      [keys]="pyramidKeys()"
      [highlightApex]="true"
    />

    <app-model-panel
      tone="inverse"
      [label]="content().nexora.label.value"
      [rows]="nexoraRows"
      [keys]="nexoraKeys()"
    />
  </div>
</section>
