<section class="glance" aria-labelledby="glance-title">
  <div class="glance__head">
    <img class="glance__mark" src="brand/mark.svg" alt="" />
    <h2 class="glance__title" id="glance-title">{{ content().glance.title }}</h2>
  </div>

  <dl class="glance__rows">
    @for (row of content().glance.rows; track $index) {
      <div class="glance__row">
        <dt class="glance__label">{{ row.label }}</dt>
        <dd class="glance__value">{{ row.value }}</dd>
      </div>
    }
  </dl>
</section>
