<section class="projects" appReveal>
  <div class="projects__header">
    <div class="projects__heading">
      <p class="projects__eyebrow">{{ content().eyebrow }}</p>
      <h2 class="projects__title">{{ content().title }}</h2>
    </div>

    <div class="projects__intro">
      <p class="projects__text">{{ content().intro }}</p>
      <a class="projects__cta" matButton [routerLink]="contactPath | localizedPath: locale()">
        {{ content().cta }}
        <mat-icon iconPositionEnd [svgIcon]="arrowIcon" />
      </a>
    </div>
  </div>

  <app-product-filters
    class="projects__filters"
    [archetypes]="archetypeOptions()"
    [platforms]="platformOptions()"
    [archetype]="archetypeFilter()"
    [platform]="platformFilter()"
    [total]="products().length"
    [shown]="visibleProducts().length"
    [labels]="filterLabels()"
    (archetypeChange)="onArchetypeChange($event)"
    (platformChange)="onPlatformChange($event)"
    (resetFilters)="onResetFilters()"
  />

  @if (visibleProducts().length > 0) {
    <ul class="projects__grid">
      @for (product of visibleProducts(); track product.id) {
        <li class="projects__card">
          <app-project-card [product]="product" [labels]="labels()" />
        </li>
      }
    </ul>
  } @else {
    <p class="projects__empty">{{ content().filters.empty }}</p>
  }
</section>
