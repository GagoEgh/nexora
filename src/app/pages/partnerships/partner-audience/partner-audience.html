<section class="audience" aria-labelledby="audience-title">
  <div class="audience__header">
    <div class="audience__heading">
      <p class="audience__eyebrow">{{ content().eyebrow }}</p>
      <h2 class="audience__title" id="audience-title">{{ content().title }}</h2>
    </div>

    <p class="audience__lead">{{ content().lead }}</p>
  </div>

  <ul class="audience__grid">
    @for (item of content().items; track $index) {
      <li class="audience__card">
        <app-icon-tile [icon]="item.icon.value" tone="primary" />

        <div class="audience__copy">
          <h3 class="audience__card-title">{{ item.title }}</h3>
          <p class="audience__card-text">{{ item.text }}</p>
        </div>
      </li>
    }
  </ul>
</section>
