<app-page-intro
  [crumbs]="crumbs()"
  [breadcrumbLabel]="content().breadcrumbLabel.value"
  [eyebrow]="content().eyebrow.value"
  [heading]="content().heading.value"
  [lead]="content().lead.value"
>
  <div class="partnerships__actions" intro-actions>
    <a matButton="filled" [routerLink]="contactPath | localizedPath: locale()">
      {{ content().primaryCta }}
      <mat-icon iconPositionEnd [svgIcon]="arrowIcon" />
    </a>

    <a matButton="outlined" [routerLink]="engagementPath | localizedPath: locale()">
      {{ content().secondaryCta }}
    </a>
  </div>

  <app-partner-flow />
</app-page-intro>

<app-partner-audience />

<app-partner-model />

<app-partner-process />

<app-partner-terms />

<app-start-conversation variant="compact" [copy]="conversationCopy()" />
