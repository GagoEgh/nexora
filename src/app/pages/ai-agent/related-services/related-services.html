<section class="related" appReveal aria-labelledby="related-title">
  <div class="related__heading">
    <p class="related__eyebrow">{{ content().eyebrow }}</p>
    <h2 class="related__title" id="related-title">{{ content().title }}</h2>
  </div>

  <ul class="related__grid">
    @for (card of cards(); track card.number) {
      <li><app-service-card [copy]="card" /></li>
    }
  </ul>

  <app-engagement-panel [content]="content().engage" />
</section>
