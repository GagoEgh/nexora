<app-page-intro
  [crumbs]="crumbs()"
  [breadcrumbLabel]="content().breadcrumbLabel.value"
  [eyebrow]="content().eyebrow.value"
  [heading]="content().title.value"
  [lead]="content().lead.value"
>
  <div class="ai-agent__actions" appReveal="load" intro-actions>
    <a matButton="filled" [routerLink]="contactPath | localizedPath">
      {{ content().primaryCta }}
      <mat-icon iconPositionEnd [svgIcon]="arrowIcon" />
    </a>
    <a matButton [routerLink]="solutionsPath | localizedPath">
      {{ content().secondaryCta }}
    </a>
  </div>

  <app-workflow />
</app-page-intro>

<app-overview />

<app-problems />

<app-capabilities />

<app-audiences />

<app-business-value />

<app-related-services />

<app-start-conversation variant="compact" [copy]="conversationCopy()" />
