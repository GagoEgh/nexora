name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:scripts
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npm run verify:prerender
      - run: npm run verify:seo
      - run: npm run verify:headers
      - run: npm run verify:bundle
      - run: npm run verify:images
      - run: npm run verify:translations
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run e2e:prerendered

  # `--audit-level=high` is the threshold, so this job is the gate for a high or critical
  # advisory and stays green on the moderate dev-only ones. It is deliberately not
  # `continue-on-error`: a job that cannot fail reports nothing.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
